<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
</head>
<body>
    <h1>Reset Your Password</h1>
    <p>Enter your registered email address.</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Reset Link</button>
    </form>

    <a href="{% url 'accounts:login' %}">Back to Login</a>
</body>
</html>

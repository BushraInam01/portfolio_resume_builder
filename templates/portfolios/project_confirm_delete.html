{% extends "portfolios/base.html" %}

{% block content %}

<div class="container">

    <h1>Delete Project</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ object.title }}</strong>?
    </p>

    <p>This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">
            Confirm Delete
        </button>

        <a href="{% url 'portfolios:project_list' %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}

{% extends "portfolios/base.html" %}

{% block content %}

<h1>Delete Skill</h1>

<p>Are you sure you want to delete "{{ object.name }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>

<a href="{% url 'portfolios:skill_list' %}">Cancel</a>

{% endblock %}
